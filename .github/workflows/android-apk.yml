name: Build VAMPS MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vamps-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract source ZIP and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s VAMPS_MUSIC_SOURCE.zip
          mkdir -p project
          unzip -q VAMPS_MUSIC_SOURCE.zip -d project
          test -s project/settings.gradle.kts
          test -s project/app/build.gradle.kts
          test -s project/app/src/main/AndroidManifest.xml
          echo "Android project extracted and verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: false

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAMPS-MUSIC-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
